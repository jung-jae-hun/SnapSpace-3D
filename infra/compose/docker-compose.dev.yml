services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: dev
    container_name: snapspace-web-dev
    env_file:
      - ../../.env.example
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
    depends_on:
      api:
        condition: service_started
    command: ["sh", "-c", "npm i -g pnpm && pnpm install && pnpm --filter @snapspace/web dev"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: dev
    container_name: snapspace-api-dev
    env_file:
      - ../../.env.example
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - export_data:/tmp/snapspace-exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: ["sh", "-c", "npm i -g pnpm && pnpm install && pnpm --filter @snapspace/api dev"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
      target: dev
    container_name: snapspace-worker-dev
    env_file:
      - ../../.env.example
    volumes:
      - ../../apps/worker:/app/apps/worker
      - ../../packages:/app/packages
      - ../../package.json:/app/package.json:ro
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - export_data:/tmp/snapspace-exports
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: ["sh", "-c", "npm i -g pnpm && pnpm install && pnpm --filter @snapspace/worker dev"]

  postgres:
    image: postgres:16-alpine
    container_name: snapspace-postgres-dev
    environment:
      POSTGRES_USER: snapspace
      POSTGRES_PASSWORD: snapspace
      POSTGRES_DB: snapspace
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapspace -d snapspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snapspace-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: snapspace-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  redis_data:
  minio_data:
  export_data:
