name: onboarding-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/install-all-libs.sh
      - scripts/verify-onboarding.sh
      - package.json
      - pnpm-lock.yaml
      - apps/**/package.json

jobs:
  verify-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify onboarding flow
        run: pnpm run verify:onboarding
